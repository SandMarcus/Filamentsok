name: Oppdater guide.json manuelt

on:
  workflow_dispatch: # Dette gjør at du får en knapp i nettleseren!

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Sjekk ut koden
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer openpyxl
        run: pip install openpyxl

      - name: Kjør skriptet
        run: python tools/xlsx_to_guide.py

      - name: Lagre endringer i GitHub
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add data/guide.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Oppdatert guide.json fra master.xlsx" && git push)
