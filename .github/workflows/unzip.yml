name: Pakk ut upload.zip

# Last opp en zip-fil med navnet upload.zip i roten av repoet.
# Denne jobben pakker den ut med alle mapper, sletter zip-filen og starter publiseringen.
on:
  push:
    paths: ["upload.zip"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pakk ut
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f upload.zip ]; then echo "Ingen upload.zip funnet"; exit 0; fi
          rm -rf "$RUNNER_TEMP/x" && mkdir "$RUNNER_TEMP/x"
          unzip -q upload.zip -d "$RUNNER_TEMP/x"
          src="$RUNNER_TEMP/x"
          # Hvis zip-filen har én mappe på øverste nivå, bruk innholdet i den
          if [ "$(ls -A "$src" | wc -l)" = "1" ] && [ -d "$src/$(ls -A "$src")" ]; then src="$src/$(ls -A "$src")"; fi
          # GitHub tillater ikke at denne jobben endrer arbeidsflyt-filer, så .github hoppes over
          rm -rf "$src/.github"
          cp -a "$src"/. .
          rm -f upload.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Pakk ut upload.zip" || { echo "Ingen endringer"; exit 0; }
          git push
          gh workflow run pages.yml || echo "Kunne ikke starte pages.yml. Start den manuelt under Actions."
