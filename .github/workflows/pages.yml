name: Bygg og publiser

# Kjører når CSV-filer, malen, koden eller nettsiden endres, hver natt, og kan startes for hånd.
# Hvilke butikker som hentes på nytt avgjøres av tools/select_stores.py:
#   - hver natt: alle butikkene
#   - manuell start: de du har krysset av under «Run workflow»
#   - push til main: bare butikkene der endringen påvirker hentingen (tools/<butikk>_feed.py er endret)
# Butikker som ikke hentes (eller som feiler) beholder prisene fra siste publiserte versjon (tools/restore_feeds.py).
on:
  push:
    branches: [main]
    paths: ["data/**", "config/**", "src/**", "web/**", "tests/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
    inputs:
      hent_elefun:
        description: "Hent Elefun på nytt (ellers beholdes siste publiserte priser)"
        type: boolean
        default: true
      hent_normax3d:
        description: "Hent NorMax3D på nytt (ellers beholdes siste publiserte priser)"
        type: boolean
        default: true
      hent_stratum3d:
        description: "Hent Stratum3D på nytt (ellers beholdes siste publiserte priser)"
        type: boolean
        default: true
      hent_materiex:
        description: "Hent Materie X på nytt (ellers beholdes siste publiserte priser)"
        type: boolean
        default: true
      hent_multicom:
        description: "Hent Multicom på nytt (ellers beholdes siste publiserte priser)"
        type: boolean
        default: true
      hent_tonerweb:
        description: "Hent Tonerweb på nytt (ellers beholdes siste publiserte priser)"
        type: boolean
        default: true
      hent_filamentfabrikken:
        description: "Hent Filamentfabrikken på nytt (ellers beholdes siste publiserte priser)"
        type: boolean
        default: true
      hent_dkongen:
        description: "Hent 3D Kongen på nytt (ellers beholdes siste publiserte priser)"
        type: boolean
        default: true
      hent_fjord3d:
        description: "Hent Fjord3D på nytt (ellers beholdes siste publiserte priser)"
        type: boolean
        default: true
      hent_3dfixit:
        description: "Hent 3DFixit på nytt (ellers beholdes siste publiserte priser)"
        type: boolean
        default: true
      hent_polyalkemi:
        description: "Hent Polyalkemi på nytt (tar ca. 17 minutter, ellers beholdes siste publiserte priser)"
        type: boolean
        default: false
  schedule:
    - cron: "0 4 * * *"   # hver natt, så Elefun-prisene oppdateres av seg selv

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Velg butikker som skal hentes
        id: sel
        # Se tools/select_stores.py. Ved push leses endrede filer fra GitHub; lykkes ikke det, hentes alle (unntatt Polyalkemi).
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUTS_JSON: ${{ toJSON(inputs) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          args=""
          if [ "$EVENT_NAME" = "push" ]; then
            if gh api "repos/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.sha }}" --paginate --jq '.files[].filename' > "$RUNNER_TEMP/changed.txt"; then
              args="--changed $RUNNER_TEMP/changed.txt"
            fi
          fi
          python tools/select_stores.py $args
      - name: Hent forrige publiserte priser (for butikker som ikke hentes på nytt)
        # Hvert bygg publiserer filene det brukte under /feeds/. Butikker som hoppes over eller feiler beholder dermed
        # prisene fra siste publiserte versjon (f.eks. fra natten), ikke den eldre filen i repoet. Første gang
        # (ingen /feeds/ ennå), eller hvis en fil mangler eller er ugyldig, brukes filen i repoet.
        continue-on-error: true
        run: python tools/restore_feeds.py ${{ steps.sel.outputs.restore }}
      - name: Hent Elefun-feed
        if: contains(format(' {0} ', steps.sel.outputs.fetch), ' elefun ')
        # Feiler henting eller konvertering, beholdes siste publiserte fil.
        continue-on-error: true
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/elefun.csv" "https://www.elefun.no/dokumenter/pricefeed/Feed_Pricespy_NO.CSV"
          python tools/elefun_feed.py "$RUNNER_TEMP/elefun.csv" data/elefun.csv
      - name: Hent NorMax3D (WooCommerce Store API)
        if: contains(format(' {0} ', steps.sel.outputs.fetch), ' nm3d ')
        # Feiler henting, beholdes siste publiserte fil.
        continue-on-error: true
        run: python tools/nm3d_feed.py data/normax3d.csv
      - name: Hent Stratum3D (WooCommerce Store API)
        if: contains(format(' {0} ', steps.sel.outputs.fetch), ' stratum ')
        continue-on-error: true
        run: python tools/stratum_feed.py data/stratum3d.csv
      - name: Hent Materie X (Google Shopping-feed)
        if: contains(format(' {0} ', steps.sel.outputs.fetch), ' materiex ')
        continue-on-error: true
        run: python tools/materiex_feed.py data/materiex.csv
      - name: Hent Multicom (kategorisiden)
        if: contains(format(' {0} ', steps.sel.outputs.fetch), ' multicom ')
        continue-on-error: true
        run: python tools/multicom_feed.py data/multicom.csv
      - name: Hent Tonerweb (kategorisiden)
        if: contains(format(' {0} ', steps.sel.outputs.fetch), ' tonerweb ')
        continue-on-error: true
        run: python tools/tonerweb_feed.py data/tonerweb.csv
      - name: Hent Filamentfabrikken (Shopify)
        if: contains(format(' {0} ', steps.sel.outputs.fetch), ' filamentfabrikken ')
        continue-on-error: true
        run: python tools/filamentfabrikken_feed.py data/filamentfabrikken.csv
      - name: Hent 3D Kongen (WooCommerce Store API)
        if: contains(format(' {0} ', steps.sel.outputs.fetch), ' dkongen ')
        continue-on-error: true
        run: python tools/dkongen_feed.py data/3dkongen.csv
      - name: Hent Fjord3D (produkt-API)
        if: contains(format(' {0} ', steps.sel.outputs.fetch), ' fjord3d ')
        continue-on-error: true
        run: python tools/fjord3d_feed.py data/fjord3d.csv
      - name: Hent 3DFixit (WooCommerce Store API)
        if: contains(format(' {0} ', steps.sel.outputs.fetch), ' fixit ')
        continue-on-error: true
        run: python tools/fixit_feed.py data/3dfixit.csv
      - name: Hent Polyalkemi (kategorisider og produktsider)
        # Tar opptil ca. 40 minutter. Hentes hver natt, når den er avkrysset ved manuell start, og ved push bare hvis
        # tools/polyalkemi_feed.py er endret. Feiler henting, eller går tiden ut, beholdes siste publiserte pris.
        if: contains(format(' {0} ', steps.sel.outputs.fetch), ' poly ')
        continue-on-error: true
        timeout-minutes: 50
        run: python tools/polyalkemi_feed.py data/polyalkemi.csv --budget 40
      - name: Tester
        run: |
          pip install pytest
          python -m pytest -q
      - name: Bygg products.json og nettside
        env:
          # Valgfritt: sett som «Variables» under Settings → Secrets and variables → Actions.
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
        run: python -m src.build --strict --keep-history
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
